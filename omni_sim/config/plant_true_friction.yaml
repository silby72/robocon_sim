# TRUE plant WITH friction enabled -- used by friction_disturbance.yaml to show
# the DOB reconstructing unmodeled Coulomb+Stribeck friction as a disturbance.
n_motors: 1

inertia_kgm2: 5.0e-4
damping_nms: 1.0e-4
torque_constant_nm_a: 0.5
enable_electrical_dynamics: false

friction_coulomb_nm: 0.02
friction_static_nm: 0.035
stribeck_speed_rad_s: 0.5
friction_smooth_eps: 1.0e-2

enable_cogging: false

torque_max_nm: 5.0
omega_max_rad_s: 500.0
