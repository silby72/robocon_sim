schema_version: 1

# 4-wheel omni, X-configuration. base_link origin = geometric centre.
# REP-103 frame: +x forward, +y left, +z up, CCW positive. SI units.
footprint:
  shape: square            # only 'square' supported for now
  # [R] the rulebook's initial-dimension limit is 700 mm square. It is also,
  # independently, the largest chassis the 1000 mm-wide ramp admits: the
  # planner inflates by the circumscribed radius, so it needs side*sqrt(2)
  # <= 1000, i.e. side <= 707 mm. The previous 900 mm placeholder broke both
  # -- it could not get onto L1 at all once the ramp was modelled correctly.
  size_m: 0.7              # side length

center_of_mass:
  position_m: [0.0, 0.0]   # offset from base_link origin (geometric centre)
  mass_kg: 15.0
  inertia_zz_kgm2: 0.35    # about the vertical axis through the CoM

drive_wheels:
  - id: fl
    position_m: [0.34, -0.34]  # ground-contact point
    drive_axis_rad: 2.356      # 135 deg: tangential at the +x,+y corner
    radius_m: 0.0508           # 2 inch omni wheel
    gear_ratio: 6.0            # motor:wheel = 6:1  (REQUIRED, no implicit default)
    actuator_ref: m3508_fl
    reverse: false
  - id: fr
    position_m: [-0.34, -0.34]
    drive_axis_rad: 0.785      # 45 deg
    radius_m: 0.0508
    gear_ratio: 6.0
    actuator_ref: m3508_fr
    reverse: false
  - id: rl
    position_m: [-0.34, 0.34]
    drive_axis_rad: 3.927      # 225 deg
    radius_m: 0.0508
    gear_ratio: 6.0
    actuator_ref: m3508_rl
    reverse: false
  - id: rr
    position_m: [0.34, 0.34]
    drive_axis_rad: 5.498      # 315 deg
    radius_m: 0.0508
    gear_ratio: 6.0
    actuator_ref: m3508_rr
    reverse: false

# Standalone odometry pod: two passive dead wheels + the IMU's gyro.
# [A] positions/radius -- replace with the real pod when it is built.
#
# This is the standard answer to drive-wheel slip: a wheel with no drive torque
# has no traction to lose, so its encoder counts buy motion every time. Two of
# them cannot observe a 3-DOF twist on their own (two equations, three
# unknowns), so the estimator adds a gyro row -- which is why real builds pair
# them with an IMU rather than adding a third wheel.
#
# Delete this block to go back to dead reckoning off the drive wheels.
odometry:
  - id: dw_x
    type: dead_wheel
    position_m: [0.0, 0.15]    # offset in +y, rolls along +x
    measure_axis_rad: 0.0
    radius_m: 0.024            # 48 mm dead wheel
    encoder_cpr: 4096
  - id: dw_y
    type: dead_wheel
    position_m: [0.15, 0.0]    # offset in +x, rolls along +y
    measure_axis_rad: 1.5708   # 90 deg
    radius_m: 0.024
    encoder_cpr: 4096
