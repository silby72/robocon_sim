schema_version: 1

# 4-wheel omni, X-configuration. base_link origin = geometric centre.
# REP-103 frame: +x forward, +y left, +z up, CCW positive. SI units.
footprint:
  shape: square            # only 'square' supported for now
  size_m: 0.500            # side length

center_of_mass:
  position_m: [0.0, 0.0]   # offset from base_link origin (geometric centre)
  mass_kg: 15.0
  inertia_zz_kgm2: 0.35    # about the vertical axis through the CoM

drive_wheels:
  - id: fl
    position_m: [0.20, 0.20]   # ground-contact point
    drive_axis_rad: 2.356      # 135 deg: tangential at the +x,+y corner
    radius_m: 0.0508           # 2 inch omni wheel
    gear_ratio: 6.0            # motor:wheel = 6:1  (REQUIRED, no implicit default)
    actuator_ref: m3508_fl
    reverse: false
  - id: fr
    position_m: [0.20, -0.20]
    drive_axis_rad: 0.785      # 45 deg
    radius_m: 0.0508
    gear_ratio: 6.0
    actuator_ref: m3508_fr
    reverse: false
  - id: rl
    position_m: [-0.20, 0.20]
    drive_axis_rad: 3.927      # 225 deg
    radius_m: 0.0508
    gear_ratio: 6.0
    actuator_ref: m3508_rl
    reverse: false
  - id: rr
    position_m: [-0.20, -0.20]
    drive_axis_rad: 5.498      # 315 deg
    radius_m: 0.0508
    gear_ratio: 6.0
    actuator_ref: m3508_rr
    reverse: false
