name: "DOB step load on the generated M3508 plant"
seed: 7
duration_s: 2.0

clock:
  dt_sim: 1.0e-4
  dt_nav: 2.0e-2
control_rate_hz: 1000.0    # motor loop (PID + DOB) rate; integration stays at dt_sim

# Use the mechanism-generated plant (tools/build_plant.py). The hand-written
# config/plant_*.yaml still work if referenced the old way.
plant:
  true_model: config/generated/plant_true.yaml
  nominal_model: config/generated/plant_nominal.yaml

nominal_error: {j_ratio: 0.5, b_ratio: 1.0}   # inject model error for the DOB

controller:
  type: pid_with_dob
  setpoint_omega_rad_s: 30.0
  pid: {kp: 0.05, ki: 0.0, kd: 0.0}
  dob: {enabled: true, tau_q: 0.005, order: 1}

disturbance:
  - target: motor_torque
    motor_index: 0
    waveform: step
    amplitude: 0.5
    start_s: 1.0

logging:
  output: results/dob_generated_plant.csv
  signals: [omega_true, omega_ref, tau_cmd, d_hat, d_true]
