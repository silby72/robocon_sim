[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni_sim_core"
version = "1.0.0"
description = "ROS-independent core simulator for an omni-directional robot (control / trajectory / estimation study)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "ruamel.yaml>=0.18",   # comment-preserving YAML for the mechanism layer (config/robot/*, generated/*)
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
viz-extra = ["matplotlib>=3.6", "seaborn>=0.12"]  # seaborn is optional styling
test = ["pytest>=7.4"]
# GUI is a *separate* concern (spec §1: gui->core one-way only). Kept out of the
# default extras; install explicitly with `setup_env.py --extras gui`.
gui = ["PySide6>=6.5", "ruamel.yaml>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
